enum FlowType {
  MINT
  REDEEM
}

enum MintingVersion {
  V1
  V2
}

enum StakeActionType {
  DEPOSIT
  COOLDOWN_STARTED
  WITHDRAW
  UNSTAKE_CLAIMED
}

enum CooldownStatus {
  ACTIVE
  CLAIMED
}

# ── USDe mint/redeem flow (the trading-desk tape) ─────────────────────────

type MintRedeemEvent {
  id: ID! # chainId_blockNumber_logIndex
  flowType: FlowType!
  version: MintingVersion!
  # V2 only — indexed string param, so this is the keccak topic hash of the order id
  orderId: String
  benefactor: String! @index
  beneficiary: String! @index
  # minter (V1/V2 Mint) or redeemer (V1/V2 Redeem)
  executor: String!
  collateralAsset: String! @index
  collateralAmount: BigInt!
  usdeAmount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt! @index
  txHash: String!
}

type CustodyEvent {
  id: ID!
  version: MintingVersion!
  wallet: String! @index
  asset: String! @index
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt! @index
  txHash: String!
}

type CollateralAssetStats {
  id: ID! # collateral asset address
  usdeMinted: BigInt!
  usdeRedeemed: BigInt!
  collateralDeposited: BigInt!
  collateralWithdrawn: BigInt!
  mintCount: Int!
  redeemCount: Int!
  lastUpdatedTimestamp: BigInt!
}

type HourlyFlow {
  id: ID! # hour bucket start timestamp in seconds, as string
  hourStartTimestamp: BigInt! @index
  usdeMinted: BigInt!
  usdeRedeemed: BigInt!
  netFlow: BigInt!
  mintCount: Int!
  redeemCount: Int!
}

type ProtocolStats {
  id: ID! # "global"
  usdeTotalSupply: BigInt!
  cumulativeUsdeMinted: BigInt!
  cumulativeUsdeRedeemed: BigInt!
  mintCount: Int!
  redeemCount: Int!
  lastUpdatedTimestamp: BigInt!
}

type LargeTransfer {
  id: ID!
  chainId: Int! @index
  token: String! @index # "USDe" | "sUSDe"
  from: String! @index
  to: String! @index
  amount: BigInt!
  txFrom: String
  blockNumber: BigInt!
  timestamp: BigInt! @index
  txHash: String!
}

# ── Opportunities backend: multichain balances & integration TVL ──────────

type TokenBalance {
  id: ID! # chainId_token_holder
  chainId: Int! @index
  token: String! @index # "USDe" | "sUSDe"
  holder: String! @index
  balance: BigInt! @index
  # slug of the Opportunity this holder is classified into (registry), if any
  opportunitySlug: String @index
  lastUpdatedTimestamp: BigInt!
}

# A place USDe/sUSDe can be put to work (Pendle market, Aave pool, Morpho,
# CEX custody, ...). One row per registry slug; balances are live TVL held by
# the classified holder contracts. Semantics are balance-accounting: the
# balances are exactly what the venue's contracts HOLD of each token (verified
# against balanceOf), not a claim about what the venue "is for".
type Opportunity {
  id: ID! # registry slug, e.g. "pendle-susde-ethereum"
  name: String!
  protocol: String! @index
  category: String! @index
  chainId: Int! @index
  # true for venues users can put money into (money-market/dex-pool/
  # yield-tokenization/vault/perps); false for supply-attribution
  # infrastructure (bridge/cex/other). "Top opportunities" queries should
  # filter on this — the largest rows by balance are bridge lockboxes.
  isYieldVenue: Boolean! @index
  usdeBalance: BigInt!
  susdeBalance: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# Per-chain circulating supply from mint/burn accounting.
# NOTE: do NOT sum this across chains. Bridging LOCKS tokens in the mainnet
# OFT adapter (a plain transfer) and MINTS on the destination chain, so a
# cross-chain sum double-counts every bridged token. Canonical global supply =
# ChainSupply(1_<token>) alone; the sum of all non-mainnet rows reconciles
# against the mainnet bridge-adapter TokenBalance (Ethena bridges to more
# chains than this indexer covers, so indexed L2 supply <= adapter balance).
type ChainSupply {
  id: ID! # chainId_token
  chainId: Int! @index
  token: String! @index
  totalSupply: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# Sparse, transfer-driven snapshots: a row is written only for hours in which
# the opportunity's balances changed. Time-series consumers should forward-fill
# from the last snapshot at or before each hour.
type OpportunityHourlySnapshot {
  id: ID! # slug_hourStart
  opportunitySlug: String! @index
  hourStartTimestamp: BigInt! @index
  usdeBalance: BigInt!
  susdeBalance: BigInt!
}

# ── sUSDe staking & cooldown liability queue ──────────────────────────────

type StakeAction {
  id: ID!
  actionType: StakeActionType!
  # owner whose staked position changed
  account: String! @index
  caller: String
  receiver: String
  # USDe amount
  assets: BigInt!
  # sUSDe shares where known
  shares: BigInt
  blockNumber: BigInt!
  timestamp: BigInt! @index
  txHash: String!
}

type SusdeCooldown {
  id: ID! # owner address — contract keeps one active cooldown per owner
  owner: String! @index
  underlyingAmount: BigInt! @index
  cooldownEnd: BigInt! @index
  status: CooldownStatus! @index
  startedAt: BigInt!
  claimedAt: BigInt
  lastTxHash: String!
}

type RewardsPayment {
  id: ID!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt! @index
  txHash: String!
}

type StakingStats {
  id: ID! # "global"
  # net USDe in the vault: deposits - cooldown starts - direct withdrawals + rewards
  totalStakedUsde: BigInt!
  # sUSDe shares, tracked from sUSDe mint/burn transfers
  susdeTotalSupply: BigInt!
  # sum of underlying across ACTIVE cooldowns — the forward liability queue
  pendingCooldownAmount: BigInt!
  # ground truth: the silo's USDe balance from raw transfer accounting.
  # siloUsdeBalance - pendingCooldownAmount = donations into the silo + any
  # claims the matcher failed to attribute (see UnmatchedSiloOutflow).
  siloUsdeBalance: BigInt!
  cumulativeRewards: BigInt!
  cooldownDurationSeconds: BigInt!
  depositCount: Int!
  cooldownCount: Int!
  # live sUSDe yield from the trailing 7 days of RewardsReceived events:
  # apr7dPct = simple annualized rate; apy7dPct = weekly-compounded. Percent
  # units (5.2 = 5.2%). Updated on every rewards payment (~every 8h).
  apr7dPct: Float!
  apy7dPct: Float!
  lastUpdatedTimestamp: BigInt!
}

# Daily sUSDe yield series — one row per UTC day with rewards activity.
# aprDayPct annualizes that single day's rewards against the vault's staked
# USDe at the time of the last payment. Full history since staking genesis.
type DailyStakingYield {
  id: ID! # UTC day start timestamp (seconds), as string
  dayStartTimestamp: BigInt! @index
  rewardsReceived: BigInt!
  totalStakedAtEnd: BigInt!
  rewardEvents: Int!
  aprDayPct: Float!
}

# A confirmed unstake claim (USDe left the silo) that could not be attributed
# to a specific owner's cooldown — the audit trail for pendingCooldownAmount
# drift. Empty in normal operation.
type UnmatchedSiloOutflow {
  id: ID!
  to: String! @index
  txFrom: String
  amount: BigInt!
  activeCandidates: Int!
  blockNumber: BigInt!
  timestamp: BigInt! @index
  txHash: String!
}

type HourlyStakingFlow {
  id: ID! # hour bucket start timestamp in seconds, as string
  hourStartTimestamp: BigInt! @index
  usdeStaked: BigInt!
  usdeCooldownStarted: BigInt!
  usdeUnstaked: BigInt!
  rewardsReceived: BigInt!
  netFlow: BigInt! # staked - cooldownStarted - direct withdrawals
}
